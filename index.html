<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Recomp Gym Log</title>
<meta name="theme-color" content="#141B22">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one thumb-width column. Log tab = week navigator + weekly goals + one day's workout.
   Progress tab = analytics. Colours borrow competition plate colours: Push red, Legs blue, Pull yellow; cardio green/teal. */
:root{
  --bg:#ECEFF2; --surface:#FFFFFF; --sunk:#F4F6F8; --ink:#141B22; --muted:#5C6974; --faint:#8C98A2; --line:#D3DAE0; --grid:#E4E8EC;
  --push:#C9341F; --legs:#2353BF; --pull:#E2A812; --cardio:#2C8A55; --ok:#2C8A55;
  --on-push:#FFFFFF; --on-legs:#FFFFFF; --on-pull:#141B22; --on-cardio:#FFFFFF;
  --day:var(--ink); --on-day:var(--surface);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --nav-h:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1317; --surface:#172027; --sunk:#111920; --ink:#E7ECF0; --muted:#93A1AC; --faint:#6B7984; --line:#29343D; --grid:#222C34;
    --push:#E25A44; --legs:#5F86DE; --pull:#BC8C14; --cardio:#2BA59A; --ok:#4DC38A;
    --on-push:#0E1317; --on-legs:#0E1317; --on-pull:#0E1317; --on-cardio:#0E1317;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1317; --surface:#172027; --sunk:#111920; --ink:#E7ECF0; --muted:#93A1AC; --faint:#6B7984; --line:#29343D; --grid:#222C34;
  --push:#E25A44; --legs:#5F86DE; --pull:#BC8C14; --cardio:#2BA59A; --ok:#4DC38A;
  --on-push:#0E1317; --on-legs:#0E1317; --on-pull:#0E1317; --on-cardio:#0E1317;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body.k-push{--day:var(--push);--on-day:var(--on-push)}
body.k-legs{--day:var(--legs);--on-day:var(--on-legs)}
body.k-pull{--day:var(--pull);--on-day:var(--on-pull)}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--legs);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(var(--nav-h) + 96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.05}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.small{font-size:13px;color:var(--muted)}
a{color:var(--legs)}

/* week navigator */
.weeknav{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.weeknav .lbl{flex:1;text-align:center;font-family:var(--display);font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn:disabled{opacity:.35;cursor:default}
.pillbtn{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:0 0 12px;touch-action:pan-y}
.wd{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.wd .d{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.wd .n{font-family:var(--display);font-size:20px;font-weight:700;line-height:1}
.wd .pips{display:flex;gap:2px;height:7px}
.wd .pips i{width:7px;height:7px;border-radius:50%;display:block}
.wd.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.wd.today .d{color:var(--ink)}
.wd.future{opacity:.5}

/* goals */
.goals{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:18px}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 8px;display:flex;flex-direction:column;gap:3px;min-width:0}
.goal .gk{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.goal .gk i{width:8px;height:8px;border-radius:50%;flex:none}
.goal .gv{font-family:var(--display);font-size:19px;font-weight:700;line-height:1;display:flex;align-items:center;gap:4px}
.goal.met{border-color:var(--ok)}
.goal.met .gv{color:var(--ok)}
.goal svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

/* day */
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.dayhead h1{font-size:34px;text-transform:uppercase}
.picker{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pick{position:relative;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.pick .pn{font-family:var(--display);font-size:18px;font-weight:700;text-transform:uppercase;line-height:1}
.pick .ps{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pick i{width:10px;height:10px;border-radius:50%}
.pick.sug{border-style:dashed;border-color:var(--ink)}
.pick.sug::after{content:"Next up";position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:999px;white-space:nowrap}
.pick.on{border-color:var(--day);background:var(--day);color:var(--on-day)}
.pick.on .ps{color:inherit;opacity:.85}
.pick.on i{background:var(--on-day)!important}
.pick .dn{position:absolute;top:5px;right:6px;width:14px;height:14px;stroke:var(--ok);fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.pick.on .dn{stroke:var(--on-day)}
.sugcard{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.sugcard p{margin:0;color:var(--muted)}
.sugcard b{color:var(--ink)}
.acts{margin-top:16px}
.acts .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{height:40px;padding:0 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--cardio);border-color:var(--cardio);color:var(--on-cardio)}
.chip svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.intro{color:var(--muted);margin:14px 0 0;max-width:60ch;font-size:15px}
.prog{display:flex;align-items:center;gap:10px;margin:10px 0 12px}
.prog .track{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.prog .fill{height:100%;background:var(--day);width:0;transition:width .25s}
.prog .lbl{font-size:13px;color:var(--muted);white-space:nowrap}

/* exercise card */
.list{display:flex;flex-direction:column;gap:12px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 10px}
.ex.complete{border-color:var(--ok)}
.ex-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex h2{font-size:23px;min-width:0}
.ex .spec{font-family:var(--display);font-size:20px;font-weight:700;white-space:nowrap}
.ex .meta{font-size:13px;color:var(--muted);margin-top:2px}
.hint{margin:10px 0 6px;background:var(--sunk);border-radius:10px;padding:8px 10px;font-size:14px;display:flex;flex-direction:column;gap:2px}
.hint b{font-weight:600}
.hint .up{color:var(--ok);font-weight:600}
.set{display:grid;grid-template-columns:44px 1fr 18px 1fr 52px;align-items:center;gap:6px;padding:6px 0;border-top:1px solid var(--line)}
.set:first-child{border-top:0}
.set .i{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.set .x{text-align:center;color:var(--muted)}
.fld{position:relative;min-width:0}
.fld input{width:100%;height:46px;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:0 34px 0 10px;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.fld input::placeholder{color:var(--muted);opacity:.55;font-weight:500}
.fld span{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.chk{height:46px;width:52px;border-radius:10px;border:2px solid var(--line);background:transparent;display:grid;place-items:center}
.chk svg{width:22px;height:22px;stroke:var(--muted);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.set.on .chk{background:var(--ok);border-color:var(--ok)}
.set.on .chk svg{stroke:var(--surface)}
.set.on input{background:transparent}
.note{font-size:14px;color:var(--muted);margin:14px 2px 0}
.note b{color:var(--ink)}

/* timer */
.timer{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));z-index:20;pointer-events:none}
.timer-in{max-width:560px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px;pointer-events:auto;position:relative;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.timer .t{font-family:var(--display);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;min-width:3.2ch}
.timer .w{flex:1;min-width:0;font-size:13px;opacity:.8;line-height:1.25}
.timer button{height:40px;padding:0 12px;border-radius:9px;border:1px solid color-mix(in srgb,var(--bg) 35%,transparent);background:transparent;color:var(--bg);font-weight:600;font-size:14px}
.timer .tb{position:absolute;left:0;bottom:0;height:3px;background:var(--bg);opacity:.6;width:100%}
.timer.over .timer-in{background:var(--ok)}
.timer.over .t{font-size:24px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px));z-index:21}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:var(--nav-h)}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--ink)}

/* analytics */
.phead{margin-bottom:14px}
.phead h1{font-size:34px;text-transform:uppercase}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.tile .v{font-family:var(--display);font-size:30px;font-weight:700;line-height:1}
.tile .v small{font-size:15px;color:var(--muted);font-weight:600}
.tile .k{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.3}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.card h2{font-size:22px;text-transform:uppercase}
.card .sub{font-size:13px;color:var(--muted);margin:0 0 10px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--body);font-size:11px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;line-height:1.35;padding:6px 8px;border-radius:8px;white-space:nowrap;z-index:5;transform:translate(-50%,-100%);font-variant-numeric:tabular-nums}
.tip b{font-weight:600}
.tip .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.heat{overflow-x:auto}
.heat .cell{cursor:pointer}
.tbl-wrap{overflow-x:auto;margin-top:10px}
table.dt{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
table.dt th,table.dt td{padding:6px 8px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
table.dt th:first-child,table.dt td:first-child{text-align:left}
table.dt th{font-weight:600;color:var(--muted);border-top:0}
.linkbtn{background:none;border:0;padding:0;color:var(--legs);font-size:13px;font-weight:600}
.exsel{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:2px 0 10px;scrollbar-width:none}
.exsel button{flex:none;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--sunk);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.exsel button i{width:8px;height:8px;border-radius:50%}
.exsel button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.stat{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:6px}
.stat div{display:flex;flex-direction:column}
.stat .v{font-family:var(--display);font-size:24px;font-weight:700;line-height:1.05}
.stat .k{font-size:12px;color:var(--muted)}
.up{color:var(--ok)}
.prs{display:flex;flex-direction:column}
.prs div{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.prs div:first-child{border-top:0}
.prs .w{font-size:12px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.bodyform{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.bodyform label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
.bodyform input{height:44px;width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:0 10px;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.bodyform .full{grid-column:1/-1}
.btn{height:44px;border-radius:10px;border:0;background:var(--ink);color:var(--surface);font-weight:600;padding:0 16px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.warn{background:transparent;color:var(--push);border:2px solid var(--push)}
.multi{display:grid;grid-template-columns:1fr;gap:12px}
.mini h3{font-family:var(--body);font-size:13px;font-weight:600;color:var(--muted);margin-bottom:2px;display:flex;justify-content:space-between}
.mini h3 b{color:var(--ink);font-size:15px}
.msg{font-size:13px;color:var(--ok);min-height:1em;margin-top:6px}
.backup textarea{width:100%;min-height:80px;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:8px;font-size:12px;font-family:ui-monospace,Menlo,monospace;resize:vertical;margin:8px 0}
.brow{display:flex;gap:8px;flex-wrap:wrap}
.brow .btn{flex:1;min-width:130px}

/* plan */
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:12px}
.pcard h2{font-size:22px;text-transform:uppercase;margin-bottom:6px}
.pcard p{margin:6px 0 0;max-width:62ch}
.pcard ul{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.figs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.fig{background:var(--sunk);border-radius:10px;padding:10px 12px}
.fig .v{font-family:var(--display);font-size:28px;font-weight:700;line-height:1}
.fig .k{font-size:12px;color:var(--muted);margin-top:4px}
.wtable{width:100%;border-collapse:collapse;font-size:14px;margin-top:4px}
.wtable td{padding:7px 0;border-top:1px solid var(--line);vertical-align:top}
.wtable td:first-child{width:96px;font-weight:600}
.wtable tr:first-child td{border-top:0}
.warnbar{background:var(--sunk);border:1px solid var(--push);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
@media (min-width:480px){ .multi{grid-template-columns:1fr 1fr 1fr} }
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>


<div class="wrap">
  <div id="warn" class="warnbar" hidden>This browser isn't saving data, so your log will be lost when you close it. Open the app in Chrome (not a private tab) to keep it.</div>
  <main id="view"></main>
</div>

<div class="timer" id="timer" hidden>
  <div class="timer-in">
    <div class="t" id="tTime">1:30</div>
    <div class="w" id="tWhat">Rest</div>
    <button type="button" id="tAdd">+30 s</button>
    <button type="button" id="tSkip">Skip</button>
    <div class="tb" id="tBar"></div>
  </div>
</div>

<nav class="nav" aria-label="Sections">
  <div class="nav-in">
    <button type="button" id="nav-log" data-tab="log"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>Log</button>
    <button type="button" id="nav-stats" data-tab="stats"><svg viewBox="0 0 24 24"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg>Progress</button>
    <button type="button" id="nav-plan" data-tab="plan"><svg viewBox="0 0 24 24"><path d="M7 3h10a1 1 0 0 1 1 1v17l-6-3-6 3V4a1 1 0 0 1 1-1z"/></svg>Plan</button>
  </div>
</nav>

<script>
(function(){
"use strict";
var DOC_URL = "https://claude.ai/code/artifact/c1433f5c-06b5-448b-8fb2-731cce736a80";

/* ---------- plan ---------- */
var WORKOUTS = {
  push:{group:"push", name:"Push", title:"Upper Push", sub:"Chest, shoulders, triceps", mins:"~60 min",
    intro:"Pick weights where the last 1–2 reps of each set are hard. One lighter warm-up set before each big lift.",
    ex:[
      {id:"bench",  name:"Bench press", alt:"Dumbbell or barbell", sets:4, lo:6,  hi:10, rest:90},
      {id:"incline",name:"Incline dumbbell press", sets:3, lo:8, hi:12, rest:90},
      {id:"ohp",    name:"Overhead press", alt:"Seated or standing", sets:3, lo:8, hi:10, rest:90},
      {id:"lateral",name:"Lateral raises", sets:3, lo:12, hi:15, rest:60},
      {id:"triceps",name:"Triceps pushdown", alt:"Rope pushdown or overhead extension", sets:3, lo:10, hi:15, rest:60}
    ]},
  pull:{group:"pull", name:"Pull", title:"Upper Pull", sub:"Back, rear delts, biceps", mins:"~60 min",
    intro:"Rows and pulldowns drive the muscle here. Put the effort there before the arm work. Last 1–2 reps hard.",
    ex:[
      {id:"pullup",   name:"Pull-ups", alt:"Assisted if needed, or lat pulldown", sets:4, lo:6, hi:10, rest:90},
      {id:"row",      name:"Bent-over row", alt:"Or chest-supported row", sets:4, lo:8, hi:10, rest:90},
      {id:"cablerow", name:"Seated cable row", sets:3, lo:10, hi:12, rest:90},
      {id:"facepull", name:"Face pulls", alt:"Or rear-delt fly", sets:3, lo:12, hi:15, rest:60},
      {id:"curl",     name:"Biceps curl", alt:"Dumbbell or cable", sets:3, lo:10, hi:12, rest:60}

  lower:{group:"legs", name:"Legs", title:"Legs Full", sub:"Hips, hamstrings, glutes, core", mins:"~55 min",

function trim(n){ return (Math.round(n*10)/10).toString(); }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];}); }
function fmtSet(s){ var kg=num(s.kg), r=num(s.reps); return (kg? trim(kg)+" kg × " : "") + (r!=null? trim(r) : "–"); }

function dayGroups(d){

}

  var s={push:0,pull:0,legs:0,active:0, sets:{push:0,pull:0,legs:0}};
  weekOf(anyDay).forEach(function(d){
    var g=dayGroups(d); Object.keys(g).forEach(function(k){ s[k]++; s.sets[k]+=g[k]; });
    if (dayActs(d).length) s.active++;
  });
  return s;
}
function lastDone(group, before){
  var ds=Object.keys(db.logs).filter(function(d){ return d<before && dayGroups(d)[group]; }).sort();
  return ds.length? ds[ds.length-1] : null;
}
function lastFor(exId, before){
  var ds=Object.keys(db.logs).filter(function(d){ return d<before; }).sort().reverse();
  for (var i=0;i<ds.length;i++){ var s=db.logs[ds[i]].sets && db.logs[ds[i]].sets[exId]; if (doneSets(s).length) return {date:ds[i], sets:s}; }
  return null;
}
function e1rm(kg,r){ return kg>0 ? kg*(1+r/30) : 0; }
/* what to train on day d */
function suggest(d){
  var wk=weekOf(d).filter(function(x){ return x!==d; }), have={push:0,pull:0,legs:0};
  wk.forEach(function(x){ var g=dayGroups(x); for (var k in g) have[k]++; });
  var yday=dayGroups(addDays(d,-1));
  var missing=["push","pull","legs"].filter(function(k){ return have[k]<GOAL[k]; });
  if (!missing.length) return null;
  var scored=missing.map(function(k){
    var last=lastDone(k,d), gap= last? daysBetween(last,d) : 99;
    var score=gap + (k==="legs"?0:4) - (yday[k]?50:0);
    return {k:k, score:score, gap:gap};
  }).sort(function(a,b){ return b.score-a.score; });
  var top=scored[0];
  var key= top.k==="legs" ? "lowerx" : top.k;
  return {pick:key, group:top.k, gap:top.gap, missing:missing};

/* tooltip helper */
function tipFor(box){
  var t=box.querySelector(".tip"); if (!t){ t=document.createElement("div"); t.className="tip"; t.hidden=true; box.appendChild(t); }
  return t;
}
function showTip(box,x,y,html){
  var t=tipFor(box); t.innerHTML=html; t.hidden=false;
  var w=box.clientWidth, tw=t.offsetWidth; x=Math.max(tw/2, Math.min(w-tw/2, x));
  t.style.left=x+"px"; t.style.top=(y-8)+"px";
}
function hideTip(box){ var t=box.querySelector(".tip"); if (t) t.hidden=true; }
function niceTicks(min,max,count){
  if (max===min){ max=min+1; min=Math.max(0,min-1); }
  var span=max-min, step=Math.pow(10,Math.floor(Math.log10(span/count))), err=span/count/step;
  if (err>=7.5) step*=10; else if (err>=3.5) step*=5; else if (err>=1.5) step*=2;
  var lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step, out=[];
  for (var v=lo; v<=hi+step/2; v+=step) out.push(Math.round(v*1000)/1000);
  return out;
}

function drawHeat(){
  var box=document.getElementById("heat"), W=16, cs=15, gap=3, top=16, left=26;
  var start=addDays(monday(TODAY),-7*(W-1));
  var width=left+W*(cs+gap), height=top+7*(cs+gap);
  var s='<svg viewBox="0 0 '+width+' '+height+'" style="max-width:'+(width*1.35)+'px" role="img" aria-label="Training days, last 16 weeks">';
  ["M","","W","","F","","S"].forEach(function(l,i){ if (l) s+='<text x="0" y="'+(top+i*(cs+gap)+cs-3)+'">'+l+'</text>'; });
  var lastMon=-1, lastW=-9;
  for (var w=0; w<W; w++){
    var ws=addDays(start,7*w), mo=pd(ws).getMonth();
    if (mo!==lastMon){ if (w===0 && pd(addDays(ws,6)).getMonth()!==mo){ mo=pd(addDays(ws,6)).getMonth(); } if (w===0 || w-lastW>=3){ s+='<text x="'+(left+w*(cs+gap))+'" y="10">'+MON[mo]+'</text>'; lastW=w; } lastMon=mo; }
    for (var dI=0; dI<7; dI++){
      var d=addDays(ws,dI), x=left+w*(cs+gap), y=top+dI*(cs+gap);
      if (d>TODAY){ continue; }
      var g=dayGroups(d), types=GROUP_ORDER.filter(function(k){return g[k];}).map(function(k){return GROUPS[k].col;});
      if (dayActs(d).length) types.push("var(--cardio)");
      s+='<g class="cell" data-date="'+d+'">';
      if (!types.length) s+='<rect x="'+x+'" y="'+y+'" width="'+cs+'" height="'+cs+'" rx="3" fill="var(--grid)"/>';
      else {
        s+='<clipPath id="c'+d.replace(/-/g,"")+'"><rect x="'+x+'" y="'+y+'" width="'+cs+'" height="'+cs+'" rx="3"/></clipPath><g clip-path="url(#c'+d.replace(/-/g,"")+')">';
        var sw=cs/types.length; types.forEach(function(c,i){ s+='<rect x="'+(x+i*sw)+'" y="'+y+'" width="'+(sw+0.3)+'" height="'+cs+'" fill="'+c+'"/>'; });
        s+='</g>';
      }
      if (d===TODAY) s+='<rect x="'+(x-1)+'" y="'+(y-1)+'" width="'+(cs+2)+'" height="'+(cs+2)+'" rx="4" fill="none" stroke="var(--ink)" stroke-width="1.5"/>';
      s+='<rect x="'+(x-1)+'" y="'+(y-1)+'" width="'+(cs+gap)+'" height="'+(cs+gap)+'" fill="transparent"/></g>';
    }
  }
  box.innerHTML=s+'</svg>';
  var svg=box.querySelector("svg");
  svg.addEventListener("click", function(ev){ var c=ev.target.closest(".cell"); if (!c) return; ui.sel=c.dataset.date; ui.tab="log"; saveUi(); render(); window.scrollTo({top:0}); });
  svg.addEventListener("pointermove", function(ev){
    var c=ev.target.closest(".cell"); if (!c){ hideTip(box); return; }
    var d=c.dataset.date, g=dayGroups(d), parts=GROUP_ORDER.filter(function(k){return g[k];}).map(function(k){return GROUPS[k].name+" ("+g[k]+" sets)";});
    dayActs(d).forEach(function(a){ parts.push(ACTS.filter(function(x){return x.id===a;})[0].name); });
    var r=c.getBoundingClientRect(), br=box.getBoundingClientRect();
    showTip(box, r.left-br.left+r.width/2, r.top-br.top, '<b>'+DAY[pd(d).getDay()]+' '+fmtShort(d)+'</b><br>'+(parts.length?parts.join(" · "):"Rest"));
  });
  svg.addEventListener("pointerleave", function(){ hideTip(box); });
}

function drawVol(){
  var box=document.getElementById("vol"), weeks=weekStarts(12);
  var data=weeks.map(function(w){ var s=weekStats(w).sets; return {w:w, push:s.push, legs:s.legs, pull:s.pull, total:s.push+s.legs+s.pull}; });
  var W=Math.max(280, box.clientWidth||320), H=190, L=30, R=6, T=10, B=24;
  var max=Math.max(10, Math.max.apply(null,data.map(function(x){return x.total;})));
  var ticks=niceTicks(0,max,4), ymax=ticks[ticks.length-1];
  var band=(W-L-R)/data.length, bw=Math.min(22, band*0.62);
  function Y(v){ return T+(H-T-B)*(1-v/ymax); }
  var s='<svg viewBox="0 0 '+W+' '+H+'" height="'+H+'" role="img" aria-label="Weekly hard sets by muscle group">';
  ticks.forEach(function(t){ s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(t)+'" y2="'+Y(t)+'" stroke="var(--grid)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(Y(t)+4)+'" text-anchor="end">'+t+'</text>'; });
  data.forEach(function(x,i){
    var cx=L+band*i+band/2, y0=Y(0), segs=GROUP_ORDER.filter(function(k){return x[k]>0;});
    segs.forEach(function(k,si){
      var h=(H-T-B)*x[k]/ymax, y=y0-h, bot=y0-(si>0?2:0), hh=Math.max(0,bot-y), isTop=si===segs.length-1;
      if (isTop){ var r=Math.min(4,hh/2), x0=cx-bw/2, x1=cx+bw/2;
        s+='<path d="M'+x0+','+bot+' V'+(y+r)+' Q'+x0+','+y+' '+(x0+r)+','+y+' H'+(x1-r)+' Q'+x1+','+y+' '+x1+','+(y+r)+' V'+bot+' Z" fill="'+GROUPS[k].col+'"/>'; }
      else s+='<rect x="'+(cx-bw/2)+'" y="'+y+'" width="'+bw+'" height="'+hh+'" fill="'+GROUPS[k].col+'"/>';
      y0=y;
    });
    if (i%2===(data.length-1)%2) s+='<text x="'+cx+'" y="'+(H-6)+'" text-anchor="middle">'+fmtShort(x.w)+'</text>';
    s+='<rect class="hit" data-i="'+i+'" x="'+(L+band*i)+'" y="'+T+'" width="'+band+'" height="'+(H-T-B)+'" fill="transparent"/>';
  });
  s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(0)+'" y2="'+Y(0)+'" stroke="var(--line)" stroke-width="1"/>';
  box.innerHTML=s+'</svg>';
  var svg=box.querySelector("svg");
  function onMove(ev){ var c=ev.target.closest(".hit"); if (!c){ hideTip(box); return; } var x=data[+c.dataset.i];
    var r=c.getBoundingClientRect(), br=box.getBoundingClientRect();
    showTip(box, r.left-br.left+r.width/2, Y(x.total)*(br.height/H), '<b>Week of '+fmtShort(x.w)+'</b><br>'+
      GROUP_ORDER.map(function(k){ return '<span class="sw" style="background:'+GROUPS[k].col+'"></span>'+GROUPS[k].name+' '+x[k]; }).join('<br>')); }
  svg.addEventListener("pointermove", onMove); svg.addEventListener("pointerdown", onMove);
  svg.addEventListener("pointerleave", function(){ hideTip(box); });
  var t=document.getElementById("volT");
  t.innerHTML = ui.showTable ? '<div class="tbl-wrap"><table class="dt"><thead><tr><th>Week of</th><th>Push</th><th>Pull</th><th>Legs</th><th>Total</th></tr></thead><tbody>'+
    data.slice().reverse().map(function(x){ return '<tr><td>'+fmtShort(x.w)+'</td><td>'+x.push+'</td><td>'+x.pull+'</td><td>'+x.legs+'</td><td>'+x.total+'</td></tr>'; }).join("")+'</tbody></table></div>' : "";
}

function exSeries(id){
  return allDates().map(function(d){
    var s=db.logs[d].sets && db.logs[d].sets[id], ds=doneSets(s); if (!ds.length) return null;
    var best=null;
    ds.forEach(function(x){ var kg=num(x.kg)||0, r=num(x.reps)||0, v=e1rm(kg,r)||r; if (!best||v>best.v) best={v:v,kg:kg,r:r}; });
    return {d:d, v:best.v, kg:best.kg, r:best.r, weighted:best.kg>0};
  }).filter(Boolean);
}
function drawStrengthSel(){
  var sel=document.getElementById("exsel"), logged=Object.keys(EX_NAME).filter(function(id){ return id!=="core" && exSeries(id).length; });
  var box=document.getElementById("strength");
  if (!logged.length){ sel.innerHTML=""; box.innerHTML='<p class="empty">Log a few sessions and your strength trend for each lift appears here.</p>'; return; }
  if (!ui.ex || logged.indexOf(ui.ex)<0) ui.ex=logged[0];
  var order=["bench","incline","ohp","lateral","triceps","pullup","row","cablerow","facepull","curl","rdl","hipthrust","hamcurl","legpress","calf"];
  sel.innerHTML=order.filter(function(id){return logged.indexOf(id)>=0;}).map(function(id){
    return '<button type="button" data-ex="'+id+'" aria-pressed="'+(id===ui.ex)+'"><i style="background:'+GROUPS[EX_GROUP[id]].col+'"></i>'+esc(EX_NAME[id])+'</button>'; }).join("");
  drawStrength();
}
function drawStrength(){
  var box=document.getElementById("strength"), id=ui.ex, pts=exSeries(id), col=GROUPS[EX_GROUP[id]].col;
  var weighted=pts.some(function(p){return p.weighted;}), unit=weighted?"kg":"reps";
  var first=pts[0], last=pts[pts.length-1], best=pts.reduce(function(a,b){return b.v>a.v?b:a;});
  var ch= pts.length>1 && first.v ? (last.v/first.v-1)*100 : null;
  var h='<div class="stat"><div><span class="v num">'+trim(last.v)+' '+unit+'</span><span class="k">Latest ('+fmtShort(last.d)+')</span></div>'+
        '<div><span class="v num">'+trim(best.v)+' '+unit+'</span><span class="k">Best</span></div>'+
        (ch!==null?'<div><span class="v num '+(ch>0?"up":"")+'">'+(ch>0?"+":"")+trim(ch)+'%</span><span class="k">Since '+fmtShort(first.d)+'</span></div>':'')+'</div>';
  h+='<div class="chart" id="sChart"></div><p class="small" style="margin:6px 0 0">'+(weighted?"Estimated from your best set each session (weight × (1 + reps ÷ 30)), so a heavier set and an extra rep both count.":"Best reps per session (no weight logged).")+'</p>';
  box.innerHTML=h;
  if (pts.length<2){ document.getElementById("sChart").innerHTML='<p class="empty">One session logged. The trend line appears after the next one.</p>'; return; }
  lineChart(document.getElementById("sChart"), pts.map(function(p){ return {d:p.d, v:p.v, tip:'<b>'+fmtShort(p.d)+'</b><br>'+trim(p.v)+' '+unit+(p.weighted?'<br>'+trim(p.kg)+' kg × '+trim(p.r):'')}; }), col, unit, 170);
}
function lineChart(box, pts, col, unit, H){
  var W=Math.max(260, box.clientWidth||320), L=34, R=10, T=12, B=22;
  var t0=pd(pts[0].d).getTime(), t1=pd(pts[pts.length-1].d).getTime(); if (t1===t0) t1=t0+864e5;
  var vs=pts.map(function(p){return p.v;}), mn=Math.min.apply(null,vs), mx=Math.max.apply(null,vs), pad=(mx-mn)*0.15||1;
  var ticks=niceTicks(Math.max(0,mn-pad), mx+pad, 3), lo=ticks[0], hi=ticks[ticks.length-1];
  function X(d){ return L+(W-L-R)*((pd(d).getTime()-t0)/(t1-t0)); }
  function Y(v){ return T+(H-T-B)*(1-(v-lo)/(hi-lo)); }
  var s='<svg viewBox="0 0 '+W+' '+H+'" height="'+H+'" role="img" aria-label="Trend">';
  ticks.forEach(function(t){ s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(t)+'" y2="'+Y(t)+'" stroke="var(--grid)"/><text x="'+(L-6)+'" y="'+(Y(t)+4)+'" text-anchor="end">'+trim(t)+'</text>'; });
  s+='<text x="'+L+'" y="'+(H-5)+'">'+fmtShort(pts[0].d)+'</text><text x="'+(W-R)+'" y="'+(H-5)+'" text-anchor="end">'+fmtShort(pts[pts.length-1].d)+'</text>';
  var line=pts.map(function(p){ return X(p.d).toFixed(1)+","+Y(p.v).toFixed(1); }).join(" ");
  s+='<path d="M'+X(pts[0].d)+','+Y(lo)+' L'+line.split(" ").join(" L")+' L'+X(pts[pts.length-1].d)+','+Y(lo)+' Z" fill="'+col+'" fill-opacity=".1"/>';
  s+='<polyline points="'+line+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  if (pts.length<=24) pts.forEach(function(p,i){ s+='<circle cx="'+X(p.d)+'" cy="'+Y(p.v)+'" r="'+(i===pts.length-1?4.5:3)+'" fill="'+col+'" stroke="var(--surface)" stroke-width="2"/>'; });
  s+='<line class="xh" x1="0" x2="0" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"/>';
  s+='<rect x="'+L+'" y="0" width="'+(W-L-R)+'" height="'+H+'" fill="transparent" class="hitarea"/>';
  box.innerHTML=s+'</svg>';
  var svg=box.querySelector("svg"), xh=svg.querySelector(".xh");
  function mv(ev){
    var br=svg.getBoundingClientRect(), sx=(ev.clientX-br.left)*(W/br.width), best=0, bd=1e9;
    pts.forEach(function(p,i){ var dd=Math.abs(X(p.d)-sx); if (dd<bd){bd=dd;best=i;} });
    var p=pts[best], px=X(p.d); xh.setAttribute("x1",px); xh.setAttribute("x2",px); xh.setAttribute("visibility","visible");
    showTip(box, px*(br.width/W), Y(p.v)*(br.height/H), p.tip);
  }
  svg.addEventListener("pointermove", mv); svg.addEventListener("pointerdown", mv);
  svg.addEventListener("pointerleave", function(){ hideTip(box); xh.setAttribute("visibility","hidden"); });
}
function drawPRs(){
  var box=document.getElementById("prs"), events=[];
  Object.keys(EX_NAME).forEach(function(id){
    if (id==="core") return; var best=0;
    exSeries(id).forEach(function(p,i){ if (p.v>best){ if (i>0) events.push({d:p.d,id:id,p:p,prev:best}); best=p.v; } });
  });
  events.sort(function(a,b){ return a.d<b.d?1:-1; });
  if (!events.length){ box.innerHTML='<p class="empty">New personal bests show up here, starting from your second session of each lift.</p>'; return; }
  box.innerHTML=events.slice(0,6).map(function(e){
    var u=e.p.weighted?"kg":"reps";
    return '<div><span><b>'+esc(EX_NAME[e.id])+'</b><br><span class="w">'+fmtShort(e.d)+' · '+(e.p.weighted?trim(e.p.kg)+' kg × '+trim(e.p.r):trim(e.p.r)+' reps')+'</span></span><span class="num up" style="text-align:right">+'+trim(e.p.v-e.prev)+' '+u+'<br><span class="w">'+trim(e.p.v)+' '+u+'</span></span></div>';
  }).join("");
}
function drawBody(){
  var box=document.getElementById("bodyCharts"), ds=Object.keys(db.body).sort();
  if (!ds.length){ box.innerHTML='<p class="empty">No weigh-ins yet. Add your first one above.</p>'; return; }
  var defs=[{k:"bf",name:"Body fat",unit:"%",col:"var(--push)",good:-1},{k:"mm",name:"Muscle",unit:"kg",col:"var(--legs)",good:1},{k:"w",name:"Weight",unit:"kg",col:"var(--muted)",good:0}];
  var h='<div class="multi">';
  defs.forEach(function(df){
    var pts=ds.filter(function(d){ return num(db.body[d][df.k])!=null; }).map(function(d){ return {d:d, v:num(db.body[d][df.k])}; });
    if (!pts.length) return;
    var l=pts[pts.length-1], delta= pts.length>1 ? l.v-pts[0].v : null;
    var good= delta===null||df.good===0 ? "" : (delta*df.good>0?"up":"");
    h+='<div class="mini"><h3><span>'+df.name+'</span><b class="num">'+trim(l.v)+' '+df.unit+(delta!==null?' <span class="small '+good+'">'+(delta>0?"+":(Math.abs(delta)<0.05?"±":""))+trim(delta)+'</span>':'')+'</b></h3><div class="chart" data-k="'+df.k+'"></div></div>';
  });
  h+='</div><div class="tbl-wrap"><table class="dt"><thead><tr><th>Date</th><th>Weight</th><th>Fat %</th><th>Muscle</th></tr></thead><tbody>'+
     ds.slice().reverse().slice(0,8).map(function(d){ var b=db.body[d]; return '<tr><td>'+fmtShort(d)+'</td><td>'+(num(b.w)!=null?trim(num(b.w)):"–")+'</td><td>'+(num(b.bf)!=null?trim(num(b.bf)):"–")+'</td><td>'+(num(b.mm)!=null?trim(num(b.mm)):"–")+'</td></tr>'; }).join("")+'</tbody></table></div>';
  box.innerHTML=h;
  defs.forEach(function(df){
    var c=box.querySelector('.chart[data-k="'+df.k+'"]'); if (!c) return;
    var pts=ds.filter(function(d){ return num(db.body[d][df.k])!=null; }).map(function(d){ var v=num(db.body[d][df.k]); return {d:d, v:v, tip:'<b>'+fmtShort(d)+'</b><br>'+trim(v)+' '+df.unit}; });
    if (pts.length<2){ c.innerHTML='<p class="empty">Trend after the next weigh-in.</p>'; return; }
    lineChart(c, pts, df.col, df.unit, 110);
  });
}

view.addEventListener("click", function(ev){
  var t=ev.target;
  var wd=t.closest(".wd"); if (wd){ ui.sel=wd.dataset.date; renderLog(); return; }
  if (t.closest("#wPrev")){ ui.sel=addDays(ui.sel,-7); renderLog(); return; }
  if (t.closest("#wNext")){ var n=addDays(ui.sel,7); if (monday(n)>monday(TODAY)) return; ui.sel = n>TODAY ? TODAY : n; renderLog(); return; }
  if (t.closest("#wToday")){ ui.sel=TODAY; renderLog(); return; }
  var pk=t.closest("[data-pick]");
  if (pk){ var l=ensureLog(ui.sel), k=pk.dataset.pick; l.pick = (l.pick===k && pk.classList.contains("pick")) ? null : k; if (!l.pick) delete l.pick; save(); renderLog(); if (l.pick && !pk.classList.contains("pick")) { var lst=document.querySelector(".intro"); if (lst) lst.scrollIntoView({behavior:"smooth",block:"start"}); } return; }
  var ac=t.closest("[data-act]");
  if (ac){ var la=ensureLog(ui.sel); la.acts[ac.dataset.act]=!la.acts[ac.dataset.act]; save(); renderLog(); return; }
  var chk=t.closest(".chk"); if (chk){ toggleSet(chk); return; }
  var ex=t.closest("#exsel button"); if (ex){ ui.ex=ex.dataset.ex; saveUi(); document.querySelectorAll("#exsel button").forEach(function(b){ b.setAttribute("aria-pressed", String(b===ex)); }); drawStrength(); return; }
  if (t.closest("#tblT")){ ui.showTable=!ui.showTable; t.closest("#tblT").textContent=ui.showTable?"Hide table":"Show table"; drawVol(); return; }
  if (t.closest("#bCopy")){ copyBackup(); return; }
  if (t.closest("#bRestore")){ restore(t.closest("#bRestore")); return; }
});

  var d=document.getElementById("bDate").value||TODAY, w=num(document.getElementById("bW").value), f=num(document.getElementById("bF").value), m=num(document.getElementById("bM").value);
  var msg=document.getElementById("bMsg");
  if (w==null&&f==null&&m==null){ msg.style.color="var(--push)"; msg.textContent="Enter at least one number, then save."; return; }
  if (d>TODAY){ msg.style.color="var(--push)"; msg.textContent="Pick today or an earlier date."; return; }
  db.body[d]={}; if (w!=null) db.body[d].w=String(w); if (f!=null) db.body[d].bf=String(f); if (m!=null) db.body[d].mm=String(m);
  save(); drawBody(); msg.style.color=""; msg.textContent="Saved weigh-in for "+fmtShort(d)+".";
});
/* swipe the week strip */
var sx=null;
view.addEventListener("touchstart", function(ev){ if (ev.target.closest("#week")) sx=ev.touches[0].clientX; else sx=null; }, {passive:true});
view.addEventListener("touchend", function(ev){
  if (sx===null) return; var dx=ev.changedTouches[0].clientX-sx; sx=null;
  if (Math.abs(dx)<50) return;
  if (dx>0){ ui.sel=addDays(ui.sel,-7); }
  else { var n=addDays(ui.sel,7); if (monday(n)>monday(TODAY)) return; ui.sel = n>TODAY ? TODAY : n; }
  renderLog();
});

function toggleSet(btn){
  var card=btn.closest(".ex"), row=btn.closest(".set"), id=card.dataset.ex, i=+row.dataset.i;
  var pick=currentPick(), W=WORKOUTS[pick], e=W.ex.filter(function(x){return x.id===id;})[0];
  var log=ensureLog(ui.sel); log.sets[id]=log.sets[id]||[]; var s=log.sets[id][i]=log.sets[id][i]||{};
  var kgI=row.querySelector('[data-f="kg"]'), rI=row.querySelector('[data-f="reps"]');
  if (!s.done){
    if (!kgI.value && kgI.placeholder) kgI.value=kgI.placeholder;
    if (!rI.value && rI.placeholder) rI.value=rI.placeholder;
    s.kg=kgI.value.replace(",",".").trim(); s.reps=rI.value.trim(); s.done=true; log.pick=pick;
    var nx=row.nextElementSibling;
    if (nx && s.kg){ var nk=nx.querySelector('[data-f="kg"]'); if (nk && !nk.value) nk.placeholder=s.kg; }
    if (nx && s.reps){ var nr=nx.querySelector('[data-f="reps"]'); if (nr && !nr.value) nr.placeholder=s.reps; }
  } else s.done=false;
  save();
  row.classList.toggle("on", !!s.done); btn.setAttribute("aria-pressed", String(!!s.done));
  card.classList.toggle("complete", doneSets(log.sets[id]).length>=e.sets);
  var p=updateProgress();
  if (s.done){
    if (p && p.done>=p.total) showDone();
    else {
      var idx=W.ex.indexOf(e), next = i<e.sets-1 ? e.name+" · set "+(i+2) : (W.ex[idx+1]? W.ex[idx+1].name : "next exercise");
      startTimer(e.rest, "Next: "+next);
    }
  }
  try { if (navigator.vibrate) navigator.vibrate(20); } catch(x){}
  wake();
}

function copyBackup(){
  var txt=JSON.stringify(db), ta=document.getElementById("bText"), msg=document.getElementById("rMsg");
  function fb(){ ta.value=txt; ta.focus(); ta.select(); msg.textContent="Backup selected below. Long-press and copy it."; }
  try { navigator.clipboard.writeText(txt).then(function(){ msg.textContent="Backup copied. Paste it into a note or message to yourself."; }, fb); } catch(e){ fb(); }
}
function restore(btn){
  var ta=document.getElementById("bText"), msg=document.getElementById("rMsg"), p;
  try { p=migrate(JSON.parse(ta.value)); } catch(e){ p=null; }
  if (!p){ msg.style.color="var(--push)"; msg.textContent="That text isn't a backup from this log. Paste the whole backup, starting with {."; return; }
  if (!btn.dataset.armed){ btn.dataset.armed="1"; btn.textContent="Tap again to replace your current log"; msg.textContent=""; return; }
  db=p; save(); renderStats(); var m=document.getElementById("rMsg"); m.textContent="Restored "+Object.keys(db.logs).length+" days.";
}

document.querySelector(".nav").addEventListener("click", function(ev){
  var b=ev.target.closest("button"); if (!b) return;
  if (b.dataset.tab==="log" && ui.tab==="log") ui.sel=TODAY;
  ui.tab=b.dataset.tab; saveUi(); render(); window.scrollTo({top:0});
});
var rT=null; window.addEventListener("resize", function(){ clearTimeout(rT); rT=setTimeout(function(){ if (ui.tab==="stats"){ drawVol(); if (ui.ex && document.getElementById("strength")) drawStrength(); drawBody(); } }, 200); });

/* ---------- rest timer ---------- */
var tEl=document.getElementById("timer"), tTime=document.getElementById("tTime"), tWhat=document.getElementById("tWhat"), tBar=document.getElementById("tBar");
var tEnd=0, tLen=0, tInt=null, tHide=null, audio=null;
function startTimer(sec, what){
  clearTimeout(tHide); tEl.classList.remove("over"); tLen=sec*1000; tEnd=Date.now()+tLen; tWhat.textContent=what; tEl.hidden=false;
  document.getElementById("tAdd").hidden=false; document.getElementById("tSkip").textContent="Skip";
  clearInterval(tInt); tick(); tInt=setInterval(tick,250);
}
function tick(){
  var left=Math.max(0,tEnd-Date.now()), s=Math.ceil(left/1000);
  tTime.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); tBar.style.width=(tLen?left/tLen*100:0)+"%";
  if (left<=0){ clearInterval(tInt); tInt=null; overTimer(); }
}
function overTimer(){
  tEl.classList.add("over"); tTime.textContent="Go"; tWhat.textContent=tWhat.textContent.replace(/^Next: /,"Rest over. ");
  document.getElementById("tAdd").hidden=true; document.getElementById("tSkip").textContent="OK";
  beep(); try { if (navigator.vibrate) navigator.vibrate([200,100,200]); } catch(e){}
  tHide=setTimeout(function(){ tEl.hidden=true; },6000);
}
function showDone(){
  clearInterval(tInt); clearTimeout(tHide); tEl.hidden=false; tEl.classList.add("over"); tLen=0; tBar.style.width="0";
  tTime.textContent="Done"; tWhat.textContent="Session complete. Nice work."; document.getElementById("tAdd").hidden=true; document.getElementById("tSkip").textContent="OK";
  tHide=setTimeout(function(){ tEl.hidden=true; },6000);
}
document.getElementById("tAdd").addEventListener("click", function(){ tEnd+=30000; tLen+=30000; tick(); });
document.getElementById("tSkip").addEventListener("click", function(){ clearInterval(tInt); clearTimeout(tHide); tEl.hidden=true; });
function beep(){
  try { audio=audio||new (window.AudioContext||window.webkitAudioContext)();
    [0,0.25].forEach(function(t){ var o=audio.createOscillator(), g=audio.createGain(); o.frequency.value=880; g.gain.setValueAtTime(0.0001,audio.currentTime+t); g.gain.exponentialRampToValueAtTime(0.25,audio.currentTime+t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,audio.currentTime+t+0.18); o.connect(g); g.connect(audio.destination); o.start(audio.currentTime+t); o.stop(audio.currentTime+t+0.2); });
  } catch(e){}
}
document.addEventListener("pointerdown", function once(){ try { audio=audio||new (window.AudioContext||window.webkitAudioContext)(); if (audio.resume) audio.resume(); } catch(e){} document.removeEventListener("pointerdown", once); });
var lock=null;
function wake(){ try { if (!lock && navigator.wakeLock && document.visibilityState==="visible") navigator.wakeLock.request("screen").then(function(l){ lock=l; l.addEventListener("release",function(){ lock=null; }); }, function(){}); } catch(e){} }
document.addEventListener("visibilitychange", function(){
  if (document.visibilityState==="visible"){ var now=ymd(new Date()); if (now!==TODAY){ var wasToday=ui.sel===TODAY; TODAY=now; if (wasToday) ui.sel=now; render(); } if (tInt){ tick(); wake(); } }
});

render();
})();
</script>
